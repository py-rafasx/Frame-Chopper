name: Release

# Trigger the workflow when a new tag is created, or manually from the
# Actions tab ("Run workflow") to release the version in package.json.
# The tag should follow semantic versioning (e.g., v1.6.5, 1.6.5)
on:
  push:
    tags:
      - 'v*'
      - '*.*.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            bundles: nsis,msi
          - os: macos-latest
            platform: macos
            bundles: dmg
          - os: ubuntu-22.04
            platform: linux
            bundles: appimage,deb

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            libfuse2 \
            build-essential

      - name: Install npm dependencies
        run: npm ci

      - name: Extract version from package.json
        id: get_version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAURI_VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$VERSION" != "$TAURI_VERSION" ]; then
            echo "::error::package.json ($VERSION) and src-tauri/tauri.conf.json ($TAURI_VERSION) versions must match."
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Build Tauri application
        run: npm run build:tauri -- --bundles ${{ matrix.bundles }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}-build-${{ steps.get_version.outputs.version }}
          path: |
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.deb
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Extract version from package.json
        id: get_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Download Windows build artifacts
        uses: actions/download-artifact@v8
        with:
          name: windows-build-${{ steps.get_version.outputs.version }}
          path: ./release-artifacts/windows
        continue-on-error: true

      - name: Download macOS build artifacts
        uses: actions/download-artifact@v8
        with:
          name: macos-build-${{ steps.get_version.outputs.version }}
          path: ./release-artifacts/macos
        continue-on-error: true

      - name: Download Linux build artifacts
        uses: actions/download-artifact@v8
        with:
          name: linux-build-${{ steps.get_version.outputs.version }}
          path: ./release-artifacts/linux
        continue-on-error: true

      - name: List downloaded artifacts
        shell: bash
        run: |
          echo "Windows artifacts:"
          find ./release-artifacts/windows -type f -printf '  %p (%s bytes)\n' 2>/dev/null || true
          echo "macOS artifacts:"
          find ./release-artifacts/macos -type f -printf '  %p (%s bytes)\n' 2>/dev/null || true
          echo "Linux artifacts:"
          find ./release-artifacts/linux -type f -printf '  %p (%s bytes)\n' 2>/dev/null || true

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', steps.get_version.outputs.version) || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Frame Chopper ${{ steps.get_version.outputs.version }}
          body: |
            ## Frame Chopper ${{ steps.get_version.outputs.version }} — Rust + Tauri

            Tiny native build powered by Rust and Tauri 2. The executable is only a few megabytes because Tauri uses the system webview instead of bundling Chromium.

            This Rust/Tauri backend was converted from the original Electron app with the help of AI coding assistants.

            ### Downloads
            - **Windows**: NSIS installer (`.exe`) or MSI package
            - **macOS**: `.dmg`
            - **Linux**: `.AppImage` or `.deb`

            ### Installation
            1. Download the installer for your platform
            2. Run it and follow the on-screen instructions
            3. Install FFmpeg if prompted — the app shows the right command for your OS

            **Note**: FFmpeg and ffprobe are required separately. FFmpeg is not bundled with the installer.
          files: |
            release-artifacts/windows/**/*
            release-artifacts/macos/**/*
            release-artifacts/linux/**/*
          fail_on_unmatched_files: false
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
