[package]
name = "frame-chopper"
version = "1.7.0"
description = "Videos to frames converter"
authors = ["py-rafasx"]
license = "MIT"
edition = "2021"
rust-version = "1.90"

[lib]
name = "frame_chopper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
